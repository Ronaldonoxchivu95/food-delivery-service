name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [restaurant-service, order-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: ${{ matrix.service }}
        run: ruff check app tests

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          # Pulled from repository Secrets rather than hard-coded, even for
          # CI's throwaway SQLite run — keeps the workflow honest about how
          # secrets reach the app in every environment.
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret' }}
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
          REDIS_URL: "redis://localhost:6379/0"
          RESTAURANT_SERVICE_URL: "http://localhost:8001"
        run: pytest -v

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build restaurant-service image
        run: docker build -t restaurant-service:ci ./restaurant-service

      - name: Build order-service image
        run: docker build -t order-service:ci ./order-service
