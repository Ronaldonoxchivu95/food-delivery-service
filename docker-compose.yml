x-restaurant-env: &restaurant-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  DATABASE_URL: ${RESTAURANT_DATABASE_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  REDIS_URL: ${REDIS_URL}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}

x-order-env: &order-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  DATABASE_URL: ${ORDER_DATABASE_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  RESTAURANT_SERVICE_URL: ${RESTAURANT_SERVICE_URL}

services:
  postgres_restaurant:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESTAURANT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESTAURANT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESTAURANT_POSTGRES_DB}
    volumes:
      - postgres_restaurant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESTAURANT_POSTGRES_USER} -d ${RESTAURANT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_order:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER} -d ${ORDER_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  restaurant-service:
    build: ./restaurant-service
    restart: unless-stopped
    environment:
      <<: *restaurant-env
    depends_on:
      postgres_restaurant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  order-service-1:
    build: ./order-service
    restart: unless-stopped
    environment:
      <<: *order-env
    depends_on:
      postgres_order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  order-service-2:
    build: ./order-service
    restart: unless-stopped
    environment:
      <<: *order-env
    depends_on:
      postgres_order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      restaurant-service:
        condition: service_healthy
      order-service-1:
        condition: service_healthy
      order-service-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_restaurant_data:
  postgres_order_data:
  rabbitmq_data:
  redis_data:
