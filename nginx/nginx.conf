worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ---- Rate limiting ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ---- Common proxy headers (Docker/K8s-friendly, no external includes needed) ----
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # ---- Upstreams ----
    upstream restaurant_service {
        server restaurant-service:8000;
    }

    # Load-balanced across two replicas (round robin by default)
    upstream order_service {
        least_conn;
        server order-service-1:8000;
        server order-service-2:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Nginx-level health check (does not depend on upstreams)
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ---- Restaurant service ----
        location /api/restaurants {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://restaurant_service;
        }

        location /restaurant-docs {
            rewrite ^/restaurant-docs(.*)$ /docs$1 break;
            proxy_pass http://restaurant_service;
        }

        location = /restaurant-openapi.json {
            proxy_pass http://restaurant_service;
        }

        location /restaurant-metrics {
            rewrite ^/restaurant-metrics$ /metrics break;
            proxy_pass http://restaurant_service;
        }

        # ---- Order service (auth, orders, couriers) — load balanced ----
        location ~ ^/api/(auth|orders|couriers) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service;
        }

        location /order-docs {
            rewrite ^/order-docs(.*)$ /docs$1 break;
            proxy_pass http://order_service;
        }

        location = /order-openapi.json {
            proxy_pass http://order_service;
        }

        location /order-metrics {
            rewrite ^/order-metrics$ /metrics break;
            proxy_pass http://order_service;
        }

        # ---- Frontend (single-page app) ----
        # Serves the static UI for everything else; falls back to index.html
        # for any unknown path so client-side view switching keeps working
        # on a hard refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
